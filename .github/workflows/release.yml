name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        if: runner.os == 'Linux'
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Set app version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}" node -e '
            const fs = require("fs");
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
          '

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: BPL Tools ${{ github.ref_name }}
          releaseBody: |
            ### Quick Start
            1. Download the installer for your platform below
            2. Install and start BPL Tools
            3. The application asks for any required credentials when you first use each feature

            ### Features
            - **Check Player Characters**: Verify character names and ascendancies (no credentials required)
            - **Private League Invites**: Automatically process private league invitations
            - **Guild Stash Logs**: Sync guild stash changes to the BPL backend

            ### Platform Downloads
            - **Windows**: `.msi` or `-setup.exe`
            - **Linux**: `.AppImage`, `.deb` or `.rpm`
            - **macOS Intel**: `x64.dmg`
            - **macOS Apple Silicon**: `aarch64.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
